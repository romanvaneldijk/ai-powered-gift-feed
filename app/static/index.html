<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap">
<style>
  :root {
    --desk: #c9b79c; --desk-dark: #b29f83;
    --paper: #fbf7ec; --paper-edge: #efe7d3;
    --rule: #cfdbe6; --margin: #e5a3a0;
    --ink: #2b2a33; --pencil: #5d5a62; --faint: #8f8a84;
    --red: #c8423a; --green: #2f7d4f; --gold: #c58a12; --blue: #2f5fa8;
    --highlight: rgba(255, 223, 87, .55);
    --tape: rgba(236, 224, 180, .78);
    --line: 2rem;
    --gutter: clamp(10px, 1.4vw, 28px);
    --hand: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    --print: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
  }
  /* everything is sized in rem, and 1rem grows with the window, so the notebook fills any laptop screen */
  html { font-size: clamp(13px, min(1.12vw, 1.95vh), 24px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(92deg, var(--desk) 0 38px, var(--desk-dark) 38px 40px, var(--desk) 40px 90px);
    color: var(--ink); font-family: var(--print); font-size: 1.25rem;
    padding: var(--gutter); overflow: hidden;
  }

  /* ---------- the notebook spread ---------- */
  .notebook {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    width: 100%; height: 100%; min-height: 520px;
    filter: drop-shadow(0 18px 30px rgba(60, 40, 20, .35));
  }
  .page {
    position: relative; overflow: hidden; min-width: 0; min-height: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
    padding: calc(var(--line) * 1.75) 3rem calc(var(--line) * .75) 4.5rem;
    background:
      linear-gradient(90deg, transparent 3.5rem, var(--margin) 3.5rem calc(3.5rem + 2px), transparent calc(3.5rem + 2px)),
      repeating-linear-gradient(180deg, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)),
      var(--paper);
    background-position: 0 0, 0 calc(var(--line) * .75), 0 0;
  }
  .page.left { border-radius: 14px 4px 4px 14px; box-shadow: inset -24px 0 30px -24px rgba(0,0,0,.25); padding-right: 2.5rem; }
  .page.right { border-radius: 4px 14px 14px 4px; box-shadow: inset 24px 0 30px -24px rgba(0,0,0,.25); }
  .rings {
    position: absolute; left: 50%; top: 28px; bottom: 28px; width: 34px; translate: -50% 0; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 5px, #8d8a86 5px 7px, transparent 7.5px) 0 0 / 34px 38px repeat-y;
  }
  .rings::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 4px, #a9a6a1 4px 6px, #e8e6e1 6px 9px, #a9a6a1 9px 11px, transparent 11px 23px,
                                #a9a6a1 23px 25px, #e8e6e1 25px 28px, #a9a6a1 28px 30px, transparent 30px) 0 9px / 34px 38px repeat-y;
    -webkit-mask: linear-gradient(#000 0 10px, transparent 10px) 0 0 / 34px 38px repeat-y;
            mask: linear-gradient(#000 0 10px, transparent 10px) 0 0 / 34px 38px repeat-y;
  }

  .page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; height: var(--line); margin-bottom: var(--line); white-space: nowrap; }
  .page-head h1, .page-head h2 { font-family: var(--hand); font-weight: 700; font-size: 2.4rem; margin: 0; line-height: 1; }
  .page-head .date { font-family: var(--hand); font-size: 1.5rem; color: var(--pencil); overflow: hidden; text-overflow: ellipsis; }
  .scribble-underline { position: relative; display: inline-block; }
  .scribble-underline svg { position: absolute; left: -4px; right: -4px; bottom: -10px; width: calc(100% + 8px); height: 14px; }

  /* ---------- left page: the gift idea ---------- */
  #idea { position: relative; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; container-type: inline-size; }
  .idea-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; min-height: 0; }
  .photo-cell { min-height: 0; container-type: size; }
  .sketch {
    position: relative; margin: .5rem auto 0 0; width: min(100cqw, calc(100cqh - 1.5rem)); aspect-ratio: 1 / 1;
    rotate: -1.4deg; background: #fff; padding: .7rem; box-shadow: 0 2px 6px rgba(60, 40, 20, .12);
  }
  .sketch .frame { position: absolute; inset: 0; pointer-events: none; }
  .sketch .photo { width: 100%; height: 100%; object-fit: contain; display: block; }
  .sketch .doodle { width: 100%; height: 100%; }
  .tape { position: absolute; width: 5.5rem; height: 1.6rem; background: var(--tape); box-shadow: 0 1px 2px rgba(0,0,0,.08); z-index: 2; }
  .tape.a { top: -.7rem; left: -1.3rem; rotate: -32deg; }
  .tape.b { bottom: -.6rem; right: -.4rem; rotate: -28deg; }

  .notes { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-right: .3rem; }
  .tier-tab {
    align-self: flex-start; font-family: var(--hand); font-size: 1.4rem; font-weight: 700; padding: 0 .75rem; height: 1.9rem; line-height: 1.9rem;
    rotate: 2deg; background: #fff2a8; box-shadow: 1px 2px 0 rgba(0,0,0,.08); margin-top: .5rem;
  }
  .tier-tab.big { background: #e9d6ff; } .tier-tab.medium { background: #cfe6ff; } .tier-tab.small { background: #d8f2c8; }
  .gift-title {
    font-family: var(--hand); font-weight: 700; font-size: 2.5rem; line-height: 1.05; margin: 1rem 0 .4rem; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; flex: none;
  }
  .shop { color: var(--pencil); font-size: 1.25rem; line-height: 1.4; }
  .price { position: relative; display: inline-block; font-family: var(--hand); font-weight: 700; font-size: 2.4rem; padding: .2rem 1rem; margin: .6rem 0 .3rem .4rem; align-self: flex-start; }
  .price svg { position: absolute; inset: -6px -10px; width: calc(100% + 20px); height: calc(100% + 12px); overflow: visible; }
  .why {
    position: relative; font-family: var(--hand); font-size: 1.55rem; color: var(--blue); line-height: 1.15; margin-top: .8rem; flex: none;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden;
  }
  .why b { font-weight: 700; }
  .why .arrow { display: inline-block; width: 2.2rem; height: 1.5rem; vertical-align: -.2rem; margin-right: .3rem; overflow: visible; }
  .shop-link { font-family: var(--hand); font-size: 1.5rem; color: var(--ink); margin-top: .9rem; text-decoration: none; border-bottom: 2px dashed var(--faint); align-self: flex-start; }
  .shop-link:hover { color: var(--blue); border-color: var(--blue); }
  .found-via { font-size: 1rem; color: var(--faint); margin-top: .4rem; }
  .found-via a { color: var(--faint); }

  /* four equal buttons: one row when the page is wide enough, otherwise a 2 x 2 block */
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem 1rem; padding-top: 1.2rem; }
  @container (min-width: 46rem) { .actions { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .btn {
    position: relative; border: 0; background: transparent; cursor: pointer; font-family: var(--hand); font-weight: 700; font-size: 1.45rem;
    padding: .35rem .6rem .45rem; color: var(--ink); transition: transform .12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn svg.box { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .btn:hover { transform: rotate(-2deg) scale(1.04); }
  .btn:active { transform: scale(.95); }
  .btn.nope { color: var(--red); } .btn.later { color: var(--gold); } .btn.own { color: var(--blue); } .btn.like { color: var(--green); }
  .keys { text-align: center; font-size: .95rem; color: var(--faint); margin-top: .5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { font-family: var(--print); border: 1px solid var(--faint); border-radius: 4px; padding: 0 5px; }

  .cross { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .cross path { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw .35s ease-out forwards; }
  .stamp-text {
    position: absolute; top: 34%; left: 50%; translate: -50% -50%; rotate: -10deg; z-index: 6; pointer-events: none;
    font-family: var(--hand); font-weight: 700; font-size: 4rem; padding: 0 1.1rem; white-space: nowrap; border: 4px solid; border-radius: 10px; opacity: 0;
    background: rgba(251, 247, 236, .85); animation: stamp .35s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes stamp { from { opacity: 0; scale: 1.6; } to { opacity: .92; scale: 1; } }
  .turn-out { animation: turn .38s ease-in forwards; transform-origin: left center; }
  @keyframes turn { to { opacity: 0; transform: perspective(1200px) rotateY(-28deg) translateX(-30px); } }
  .turn-in { animation: turnin .35s ease-out; }
  @keyframes turnin { from { opacity: 0; transform: translateX(20px); } }

  /* question page */
  .question { padding-top: 1.5rem; overflow-y: auto; min-height: 0; }
  .question .kicker { font-family: var(--hand); font-size: 1.75rem; color: var(--blue); rotate: -2deg; display: inline-block; }
  .question h3 { font-family: var(--hand); font-size: 3.4rem; margin: .75rem 0 1.75rem; line-height: 1.05; }
  .options { display: flex; flex-wrap: wrap; gap: 1.1rem 2.1rem; }
  .opt { position: relative; font-family: var(--hand); font-size: 2.4rem; background: none; border: 0; cursor: pointer; color: var(--ink); padding: 4px 18px; }
  .opt svg { position: absolute; inset: -4px -8px; width: calc(100% + 16px); height: calc(100% + 8px); overflow: visible; opacity: 0; }
  .opt:hover svg { opacity: .45; }
  .opt.chosen svg { opacity: 1; }
  .opt.chosen svg path { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .4s forwards; }

  /* ---------- right page: the wishlist ---------- */
  #wishlist { min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-right: .3rem; }
  .tier { margin-bottom: var(--line); }
  .tier h3 {
    font-family: var(--hand); font-size: 1.9rem; font-weight: 700; margin: 0; height: var(--line); line-height: var(--line);
    display: flex; justify-content: space-between; gap: 1rem; white-space: nowrap;
  }
  .tier h3 .count { font-size: 1.5rem; color: var(--pencil); font-weight: 500; }
  .tier h3 .range { font-size: 1.25rem; color: var(--faint); font-weight: 500; margin-left: .6rem; }
  .tier ul { list-style: none; margin: 0; padding: 0; }
  .tier li {
    display: flex; align-items: center; gap: .6rem; height: var(--line); line-height: var(--line); white-space: nowrap;
    font-size: 1.3rem;
  }
  .tier li .box { flex: none; width: 1.1rem; height: 1.1rem; }
  .tier li .name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tier li .name a { color: inherit; text-decoration: none; }
  .tier li .name a:hover { text-decoration: underline wavy var(--faint); }
  .tier li .p { margin-left: auto; color: var(--pencil); font-family: var(--hand); font-size: 1.5rem; flex: none; }
  .tier li .star { color: var(--gold); flex: none; font-size: 1.1rem; }
  .tier li.empty { color: var(--faint); font-family: var(--hand); font-size: 1.4rem; }
  .tier li.fresh .name { background: linear-gradient(100deg, transparent 0%, var(--highlight) 2%, var(--highlight) 96%, transparent 100%) no-repeat 0 60% / 0% 70%; animation: hl .7s .1s ease-out forwards; }
  @keyframes hl { to { background-size: 100% 70%; } }
  .tier li.more { color: var(--faint); font-size: 1.1rem; }

  .footer-note {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; padding-top: .5rem;
    font-family: var(--hand); font-size: 1.5rem; color: var(--pencil); white-space: nowrap;
  }
  .progress { display: flex; align-items: center; gap: .6rem; }
  .progress svg { width: 11rem; height: 1rem; overflow: visible; }

  /* done page */
  .done { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .done h3 { font-family: var(--hand); font-size: 3.4rem; margin: .5rem 0 .25rem; }
  .done p { font-family: var(--hand); font-size: 1.6rem; color: var(--pencil); margin: 0 0 var(--line); }
  .taste-row { display: grid; grid-template-columns: 8rem 1fr 3rem; align-items: center; gap: .75rem; height: var(--line); font-size: 1.3rem; }
  .taste-row svg { width: 100%; height: 1.1rem; overflow: visible; }
  .taste-row .pct { font-family: var(--hand); font-size: 1.4rem; color: var(--pencil); }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    html { font-size: 15px; }
    body { overflow: auto; height: auto; }
    .notebook { grid-template-columns: 1fr; height: auto; }
    .rings { display: none; }
    .page { padding: calc(var(--line) * 1.75) 1.2rem calc(var(--line) * .75) 4.2rem !important; }
    .page.left, .page.right { border-radius: 12px; min-height: 640px; }
    .page.right { margin-top: 12px; }
    .idea-body { grid-template-columns: 1fr; }
    .photo-cell { container-type: normal; }
    .sketch { width: min(100%, 360px); }
    .actions { grid-template-columns: 1fr; }
    .keys { display: none; }
    .progress svg { width: 6rem; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
  </defs>
</svg>

<div class="notebook">
  <section class="page left">
    <div class="page-head">
      <h1 class="scribble-underline" id="leftTitle">Gift ideas</h1>
      <span class="date" id="today"></span>
    </div>
    <div id="idea"></div>
  </section>
  <div class="rings"></div>
  <section class="page right">
    <div class="page-head">
      <h2 class="scribble-underline">My wishlist</h2>
      <span class="date" id="occasion"></span>
    </div>
    <div id="wishlist"></div>
    <div class="footer-note">
      <span id="streak"></span>
      <span class="progress" id="progress"></span>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
let deck = [], index = 0, busy = false, summary = null, lastAdded = null;

/* ---------- little hand-drawn helpers (deterministic wobble per seed) ---------- */
function rng(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function wobblyRect(w, h, seed, j = 3) {
  const r = rng(seed), J = () => (r() - .5) * 2 * j;
  const p = [[2 + J(), 2 + J()], [w - 2 + J(), 2 + J()], [w - 2 + J(), h - 2 + J()], [2 + J(), h - 2 + J()]];
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i <= 4; i++) { const a = p[i - 1], b = p[i % 4]; d += ` Q${(a[0] + b[0]) / 2 + J()},${(a[1] + b[1]) / 2 + J()} ${b[0]},${b[1]}`; }
  // a second, slightly offset pass makes it look sketched
  const q = p.map(([x, y]) => [x + J() * .6, y + J() * .6]);
  d += ` M${q[0][0] + 6},${q[0][1]}`; for (let i = 1; i <= 4; i++) d += ` L${q[i % 4][0]},${q[i % 4][1]}`;
  return d;
}
function ellipse(w, h, seed) {
  const r = rng(seed), cx = w / 2, cy = h / 2; let d = '';
  for (let t = 0; t <= Math.PI * 2.15; t += .25) {
    const rx = cx * (1 + (r() - .5) * .06), ry = cy * (1 + (r() - .5) * .1);
    const x = cx + rx * Math.cos(t - .4), y = cy + ry * Math.sin(t - .4);
    d += (d ? ' L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
  }
  return d;
}
const svgBox = (w, h, seed, color, width = 2) =>
  `<svg class="box" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${wobblyRect(w, h, seed)}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" filter="url(#rough)"/></svg>`;
const underline = seed => { const r = rng(seed); return `<svg viewBox="0 0 200 14" preserveAspectRatio="none"><path d="M2,${8 + r() * 3} C50,${2 + r() * 4} 120,${11 + r() * 3} 198,${4 + r() * 4}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" opacity=".7"/></svg>`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const euro = n => '€' + (Number(n) % 1 ? Number(n).toFixed(2).replace('.', ',') : Number(n).toFixed(0));
const TIER_NAMES = { big: 'Big wishes', medium: 'Medium gifts', small: 'Small gifts' };
const TIER_TAB = { big: 'a big wish', medium: 'medium gift', small: 'small gift' };

const giftDoodle = `
<svg class="doodle" viewBox="0 0 200 200" fill="none" stroke="var(--pencil)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
  <path d="M40 92 L160 92 L156 170 L44 170 Z"/><path d="M32 70 L168 70 L168 94 L32 94 Z"/>
  <path d="M100 70 L100 170"/><path d="M86 70 L86 170" opacity=".35"/>
  <path d="M100 68 C80 40 52 46 62 62 C68 72 88 70 100 68 Z"/><path d="M100 68 C120 40 148 46 138 62 C132 72 112 70 100 68 Z"/>
  <path d="M52 110 L70 128 M52 130 L84 160 M120 110 L150 140 M128 150 L146 168" opacity=".35"/>
</svg>`;

/* ---------- rendering ---------- */
function renderIdea() {
  const box = $('#idea');
  if (index >= deck.length) return finish();
  const c = deck[index];
  $('#leftTitle').innerHTML = (c.type === 'question' ? 'Quick question' : `Gift idea ${giftNumber()}`) + underline('t' + index);
  box.classList.remove('turn-out'); void box.offsetWidth; box.classList.add('turn-in');
  if (c.type === 'question') return renderQuestion(c, box);
  const img = c.image ? `<img class="photo" src="${esc(safeUrl(c.image))}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createRange().createContextualFragment(giftDoodle))">` : giftDoodle;
  const via = /^https?:/.test(c.source || '') ? `<div class="found-via">found via <a href="${esc(c.source)}" target="_blank" rel="noopener">${esc(hostOf(c.source))}</a></div>` : '';
  box.innerHTML = `
    <div class="idea-body">
      <div class="photo-cell"><div class="sketch">
        <span class="tape a"></span><span class="tape b"></span>
        ${img}
        <svg class="frame" viewBox="0 0 300 300" preserveAspectRatio="none"><path d="${wobblyRect(300, 300, c.id, 4)}" fill="none" stroke="var(--pencil)" stroke-width="1.6" filter="url(#rough)"/></svg>
      </div></div>
      <div class="notes">
        <span class="tier-tab ${c.tier}">${TIER_TAB[c.tier]}</span>
        <div class="gift-title" title="${esc(c.title)}">${esc(c.title)}</div>
        <div class="shop">from ${esc(c.shop)}</div>
        <span class="price">${euro(c.price)}<svg viewBox="0 0 140 64" preserveAspectRatio="none"><path d="${ellipse(140, 64, c.id)}" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" opacity=".8"/></svg></span>
        ${c.reason ? `<div class="why" title="${esc(c.reason)}"><svg class="arrow" viewBox="0 0 66 46"><path d="M4 30 C18 10 40 8 60 22 M60 22 L47 22 M60 22 L54 10" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round"/></svg><b>why?</b> ${esc(c.reason)}</div>` : ''}
        <a class="shop-link" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">see it in the shop &rarr;</a>
        ${via}
      </div>
    </div>
    <div class="actions">
      <button class="btn nope" data-a="dismiss">${svgBox(220, 52, 'n' + index, 'var(--red)')}&#10007; Don't like it</button>
      <button class="btn later" data-a="later">${svgBox(220, 52, 'l' + index, 'var(--gold)')}~ Kinda, maybe later</button>
      <button class="btn own" data-a="owned">${svgBox(220, 52, 'o' + index, 'var(--blue)')}&#10003; Already own it</button>
      <button class="btn like" data-a="like">${svgBox(220, 52, 'k' + index, 'var(--green)')}&#9829; Put it on the list</button>
    </div>
    <div class="keys"><kbd>&larr;</kbd> don't like it &nbsp; <kbd>&darr;</kbd> maybe later &nbsp; <kbd>&uarr;</kbd> already own it &nbsp; <kbd>&rarr;</kbd> on the list</div>`;
  box.querySelectorAll('.btn').forEach(b => b.onclick = () => act(b.dataset.a));
  renderProgress();
}

function renderQuestion(c, box) {
  box.innerHTML = `<div class="question"><span class="kicker">bonus question, helps my next search &darr;</span>
    <h3>${esc(c.question)}</h3><div class="options"></div></div>`;
  const opts = box.querySelector('.options');
  c.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `${esc(o)}<svg viewBox="0 0 160 60" preserveAspectRatio="none"><path d="${ellipse(160, 60, o + i)}" fill="none" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round"/></svg>`;
    b.onclick = () => answer(o, b);
    opts.appendChild(b);
  });
  renderProgress();
}

function renderWishlist() {
  if (!summary) return;
  const w = $('#wishlist');
  w.innerHTML = ['big', 'medium', 'small'].map(t => {
    const items = summary.items[t] || [], target = summary.wishlist[t].target;
    const [lo, hi] = summary.tier_ranges[t];
    const shown = items.slice(0, Math.max(target, 1) + 1);
    const lis = shown.map((it, i) => `
      <li class="${it.id === lastAdded ? 'fresh' : ''}">
        <svg class="box" viewBox="0 0 18 18"><path d="${wobblyRect(18, 18, it.id, 1.2)}" fill="none" stroke="var(--pencil)" stroke-width="1.4"/>
          <path d="M4 9 L8 13 L15 3" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="name"><a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${esc(it.title)}</a></span>
        ${it.status === 'loved' ? '<span class="star">&#9733;</span>' : ''}
        <span class="p">${euro(it.price)}</span></li>`).join('');
    const empties = Math.max(0, target - items.length);
    const blank = Array.from({length: Math.min(empties, 3)}, () =>
      `<li class="empty"><svg class="box" viewBox="0 0 18 18"><path d="${wobblyRect(18, 18, t + Math.random(), 1.2)}" fill="none" stroke="var(--faint)" stroke-width="1.2"/></svg>&hellip;</li>`).join('');
    const more = items.length > shown.length ? `<li class="more">+ ${items.length - shown.length} more in wishlist.md</li>` : '';
    return `<div class="tier"><h3><span>${TIER_NAMES[t]}<span class="range">${euro(lo)}&ndash;${euro(hi)}</span></span><span class="count">${items.length} / ${target}</span></h3><ul>${lis}${more}${blank}</ul></div>`;
  }).join('');
  $('#streak').textContent = summary.streak ? `🔥 ${summary.streak} ${summary.streak === 1 ? 'day' : 'days'} in a row` : 'day one, here we go!';
}

function renderProgress() {
  const gifts = deck.filter(c => c.type === 'gift').length || 1;
  const done = Math.min(giftNumber() - 1, gifts), w = 180 * done / gifts;
  $('#progress').innerHTML = `${done} of ${gifts} <svg viewBox="0 0 180 16"><path d="M2 8 L178 8" stroke="var(--rule)" stroke-width="6" stroke-linecap="round"/>
    ${done ? `<path d="M2 8 Q${w / 2} 6 ${Math.max(w - 2, 3)} 9" fill="none" stroke="var(--pencil)" stroke-width="5" stroke-linecap="round"/>` : ''}</svg>`;
}
const giftNumber = () => index >= deck.length ? deck.filter(c => c.type === 'gift').length + 1 : deck.slice(0, index + 1).filter(c => c.type === 'gift').length;
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };

/* ---------- actions ---------- */
async function act(action) {
  if (busy || index >= deck.length || deck[index].type === 'question') return;
  busy = true;
  const card = deck[index], page = $('.page.left');
  if (action === 'dismiss') {
    page.insertAdjacentHTML('beforeend', `<svg class="cross" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M12 18 C40 46 62 66 88 86 M86 16 C60 40 38 62 14 88" fill="none" stroke="var(--red)" stroke-width="1.4" stroke-linecap="round" opacity=".75"/></svg>`);
  } else {
    page.insertAdjacentHTML('beforeend', `<div class="stamp-text" style="color:${{later: 'var(--gold)', owned: 'var(--blue)'}[action] || 'var(--green)'}">${{later: 'maybe later&hellip;', owned: 'got it already!'}[action] || 'on the list!'}</div>`);
  }
  const res = await fetch('/api/swipe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: card.id, action})}).then(r => r.json());
  if (!res.error) { summary = res; if (action === 'like') lastAdded = card.id; renderWishlist(); }
  setTimeout(() => $('#idea').classList.add('turn-out'), 260);
  setTimeout(() => {
    page.querySelectorAll('.cross, .stamp-text').forEach(e => e.remove());
    index++; busy = false; renderIdea();
  }, 620);
}

async function answer(option, btn) {
  if (busy) return;
  busy = true; btn.classList.add('chosen');
  await fetch('/api/swipe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: deck[index].id, action: 'answer', answer: option})});
  setTimeout(() => { index++; busy = false; renderIdea(); }, 650);
}

async function finish() {
  const s = await fetch('/api/done', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'}).then(r => r.json());
  summary = s; lastAdded = null; renderWishlist(); renderProgress();
  $('#leftTitle').innerHTML = 'That\'s it for today' + underline('done');
  const top = Math.max(1, ...s.taste.map(([, p]) => p));
  const taste = s.taste.length ? s.taste.map(([tag, pct], i) => {
    const r = rng(tag); let hatch = '';
    const w = Math.max(8, 190 * pct / top);
    for (let x = 4; x < w; x += 6) hatch += `M${x},${16 - r() * 2} L${x + 5},${2 + r() * 2} `;
    return `<div class="taste-row"><span>${esc(tag)}</span><svg viewBox="0 0 200 18" preserveAspectRatio="none">
      <path d="${wobblyRect(w + 4, 18, tag, 1.5)}" fill="none" stroke="var(--pencil)" stroke-width="1.4"/>
      <path d="${hatch}" stroke="var(--blue)" stroke-width="1.6" stroke-linecap="round" opacity=".75"/></svg><span class="pct">${pct}%</span></div>`;
  }).join('') : '<p>Swipe a few more days and your taste profile appears here.</p>';
  $('#idea').innerHTML = `<div class="done turn-in">
    <h3>All done! &#127881;</h3>
    <p>${s.streak} ${s.streak === 1 ? 'day' : 'days'} in a row. New ideas after the next /scout.</p>
    <h3 style="font-size:2rem;margin:0;height:var(--line)">What I seem to like</h3>
    ${taste}
    <p style="margin-top:var(--line)">You can close this tab now. Claude is updating your profile.</p></div>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') act('like');
  if (e.key === 'ArrowLeft') act('dismiss');
  if (e.key === 'ArrowDown') { e.preventDefault(); act('later'); }
  if (e.key === 'ArrowUp') { e.preventDefault(); act('owned'); }
});

$('#today').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
fetch('/api/deck').then(r => r.json()).then(d => {
  deck = d.deck; summary = d;
  renderWishlist(); renderIdea();
});
</script>
</body>
</html>
